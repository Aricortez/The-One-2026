<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The One System</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e60000">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <style>
        :root { --primario: #e60000; --oscuro: #0a0a0a; --blanco: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f4f4f4; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* LOGIN */
        #login-page { position: fixed; inset: 0; background: var(--oscuro); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: var(--blanco); padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-top: 5px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        
        /* APP */
        #main-app { display: none; height: 100vh; width: 100%; flex-direction: row; }
        .sidebar { width: 250px; background: var(--oscuro); color: white; display: flex; flex-direction: column; padding: 20px; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        
        @media (max-width: 768px) {
            #main-app { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 70px; flex-direction: row; padding: 0; border-top: 2px solid var(--primario); }
            .nav-item { flex: 1; flex-direction: column; font-size: 10px; justify-content: center; }
            .sidebar h2 { display: none; }
            .content-section { padding-bottom: 80px; }
        }

        .nav-item { padding: 15px; display: flex; align-items: center; gap: 10px; color: #888; cursor: pointer; text-align: center; }
        .nav-item.active { color: white; background: rgba(230,0,0,0.2); }
        .content-section { display: none; flex: 1; overflow-y: auto; padding: 20px; }
        .content-section.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .panel { position: fixed; right: 0; top: 0; bottom: 0; width: 100%; max-width: 350px; background: white; transform: translateX(100%); transition: 0.3s; z-index: 500; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
        .panel.open { transform: translateX(0); }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card">
            <h2 style="margin-bottom:20px">THE ONE</h2>
            <div id="login-menu">
                <button class="btn" onclick="login('empleado')">EMPLEADO</button>
                <button class="btn" onclick="showAuth('gerente')">GERENTE</button>
                <button class="btn" style="background:var(--oscuro); color:white" onclick="showAuth('jefe')">DIRECTOR</button>
            </div>
            <div id="login-auth" class="hidden">
                <h4 id="auth-title"></h4>
                <div class="input-group"><input type="text" id="user" placeholder="Usuario"></div>
                <div class="input-group"><input type="password" id="pass" placeholder="Contraseña"></div>
                <button class="btn" style="background:var(--primario); color:white" onclick="checkAuth()">ENTRAR</button>
                <p onclick="location.reload()" style="cursor:pointer; font-size:12px; color:gray">Volver</p>
            </div>
        </div>
    </div>

    <div id="main-app">
        <div class="sidebar">
            <h2 style="margin-bottom:30px">THE ONE</h2>
            <div class="nav-item active" onclick="tab('clientes', this)"><i class="ti ti-users"></i> Clientes</div>
            <div id="tab-materiales" class="nav-item solo-jefe hidden" onclick="tab('materiales', this)"><i class="ti ti-box"></i> Materiales</div>
            <div class="nav-item" onclick="tab('balance', this)"><i class="ti ti-coin"></i> Balance</div>
            <div class="nav-item" onclick="location.reload()" style="color:var(--primario); margin-top:auto"><i class="ti ti-logout"></i> Salir</div>
        </div>
        <div class="main">
            <div class="topbar">
                <b id="user-display">ROL</b>
                <button id="add-cli-btn" class="btn hidden" style="width:auto; margin:0; background:var(--oscuro); color:white" onclick="openMod('mod-cli', true)">+ CLIENTE</button>
            </div>

            <div id="sec-clientes" class="content-section active">
                <div class="card">
                    <table>
                        <thead><tr><th>Nombre</th><th>Servicio</th><th>Pagos</th></tr></thead>
                        <tbody id="lista-cli"></tbody>
                    </table>
                </div>
            </div>

            <div id="sec-materiales" class="content-section">
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <h2>Gastos</h2>
                    <button class="btn" style="width:auto; background:var(--primario); color:white" onclick="openMod('mod-mat', true)">+ Gasto</button>
                </div>
                <div class="card">
                    <table>
                        <thead><tr><th>Fecha</th><th>Item</th><th>Costo</th></tr></thead>
                        <tbody id="lista-mat"></tbody>
                    </table>
                </div>
            </div>

            <div id="sec-balance" class="content-section">
                <div id="stats-jefe" class="hidden">
                    <div class="card" style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                        <div><small>INGRESOS</small><h2 id="tot-in" style="color:green">$0</h2></div>
                        <div><small>EGRESOS</small><h2 id="tot-out" style="color:red">$0</h2></div>
                    </div>
                </div>
                <div class="card"><h3>Rendimiento</h3><div id="grafico"></div></div>
            </div>
        </div>
    </div>

    <div id="mod-cli" class="panel">
        <h3>Nuevo Cliente</h3><br>
        <input type="text" id="n-cli" placeholder="Nombre" style="width:100%; padding:10px; margin-bottom:10px">
        <select id="s-cli" style="width:100%; padding:10px; margin-bottom:10px">
            <option>Graduación</option><option>Bodas</option><option>XV Años</option><option>Retrato</option>
        </select>
        <input type="number" id="p-cli" placeholder="Pago inicial $" style="width:100%; padding:10px; margin-bottom:10px">
        <button class="btn" style="background:var(--oscuro); color:white" onclick="addCli()">Guardar</button>
        <button class="btn" onclick="openMod('mod-cli', false)">Cerrar</button>
    </div>

    <div id="mod-mat" class="panel">
        <h3>Nuevo Gasto</h3><br>
        <input type="text" id="n-mat" placeholder="Artículo" style="width:100%; padding:10px; margin-bottom:10px">
        <input type="number" id="c-mat" placeholder="Costo $" style="width:100%; padding:10px; margin-bottom:10px">
        <button class="btn" style="background:var(--oscuro); color:white" onclick="addMat()">Guardar</button>
        <button class="btn" onclick="openMod('mod-mat', false)">Cerrar</button>
    </div>

    <div id="panel-pagos" class="panel">
        <h2 id="pago-nom"></h2>
        <p id="pago-serv" style="color:var(--primario)"></p><br>
        <button class="btn" style="background:green; color:white" onclick="nuevoPago()">+ REGISTRAR COBRO</button>
        <hr><br>
        <div id="historial-pagos"></div>
        <button class="btn" style="margin-top:20px" onclick="document.getElementById('panel-pagos').classList.remove('open')">Cerrar</button>
    </div>

    <script>
        // Registro de PWA (Instalación)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => console.log("PWA lista"));
        }

        let db_c = JSON.parse(localStorage.getItem('theone_c')) || [];
        let db_m = JSON.parse(localStorage.getItem('theone_m')) || [];
        let cur_rol = '';
        let cur_type = '';
        let cur_cli = null;

        function showAuth(t) {
            cur_type = t;
            document.getElementById('auth-title').innerText = "Acceso " + t.toUpperCase();
            document.getElementById('login-menu').classList.add('hidden');
            document.getElementById('login-auth').classList.remove('hidden');
        }

        function checkAuth() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(cur_type === 'jefe' && u === 'admin' && p === '1234') login('jefe');
            else if(cur_type === 'gerente' && u === 'gerente01' && p === 'theone2026') login('gerente');
            else alert("Error");
        }

        function login(r) {
            cur_rol = r;
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('user-display').innerText = r.toUpperCase();
            if(r === 'jefe' || r === 'gerente') document.getElementById('add-cli-btn').classList.remove('hidden');
            if(r === 'jefe') {
                document.getElementById('tab-materiales').classList.remove('hidden');
                document.getElementById('stats-jefe').classList.remove('hidden');
            }
            render();
        }

        function tab(id, el) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            el.classList.add('active');
        }

        function addCli() {
            const n = document.getElementById('n-cli').value;
            const p = parseFloat(document.getElementById('p-cli').value) || 0;
            if(!n) return;
            db_c.push({ id: Date.now(), nom: n, serv: document.getElementById('s-cli').value, pagos: [{m:p, f: new Date().toLocaleDateString()}] });
            save(); openMod('mod-cli', false); render();
        }

        function addMat() {
            const n = document.getElementById('n-mat').value;
            const c = parseFloat(document.getElementById('c-mat').value) || 0;
            if(!n) return;
            db_m.push({ n, c, f: new Date().toLocaleDateString() });
            save(); openMod('mod-mat', false); render();
        }

        function render() {
            const l_c = document.getElementById('lista-cli');
            l_c.innerHTML = '';
            let total_in = 0;
            db_c.forEach(c => {
                let suma = 0; c.pagos.forEach(p => { suma += p.m; total_in += p.m; });
                l_c.innerHTML += `<tr onclick="detalles(${c.id})"><td>${c.nom}</td><td>${c.serv}</td><td>$${suma}</td></tr>`;
            });

            const l_m = document.getElementById('lista-mat');
            l_m.innerHTML = '';
            let total_out = 0;
            db_m.forEach(m => {
                total_out += m.c;
                l_m.innerHTML += `<tr><td>${m.f}</td><td>${m.n}</td><td>$${m.c}</td></tr>`;
            });

            document.getElementById('tot-in').innerText = '$' + total_in;
            document.getElementById('tot-out').innerText = '$' + total_out;
            renderGraf(total_in);
        }

        function detalles(id) {
            cur_cli = db_c.find(x => x.id === id);
            document.getElementById('pago-nom').innerText = cur_cli.nom;
            document.getElementById('pago-serv').innerText = cur_cli.serv;
            const h = document.getElementById('historial-pagos');
            h.innerHTML = cur_cli.pagos.map(p => `<div style="padding:10px; border-bottom:1px solid #eee"><b>$${p.m}</b> <small>${p.f}</small></div>`).join('');
            document.getElementById('panel-pagos').classList.add('open');
        }

        function nuevoPago() {
            const m = parseFloat(prompt("Monto del cobro:"));
            if(m) {
                cur_cli.pagos.push({m, f: new Date().toLocaleDateString()});
                save(); detalles(cur_cli.id); render();
            }
        }

        function renderGraf(total) {
            const g = document.getElementById('grafico');
            g.innerHTML = '';
            ["Graduación", "Bodas", "XV Años", "Retrato"].forEach(s => {
                let suma = 0;
                db_c.filter(x => x.serv === s).forEach(x => x.pagos.forEach(p => suma += p.m));
                let por = total > 0 ? (suma / total) * 100 : 0;
                g.innerHTML += `<div style="margin-bottom:10px">${s} ($${suma})<div style="height:8px; background:#eee; border-radius:5px"><div style="width:${por}%; height:100%; background:var(--primario); border-radius:5px"></div></div></div>`;
            });
        }

        function save() {
            localStorage.setItem('theone_c', JSON.stringify(db_c));
            localStorage.setItem('theone_m', JSON.stringify(db_m));
        }

        function openMod(id, s) { document.getElementById(id).classList.toggle('open', s); }
    </script>
</body>
</html>
